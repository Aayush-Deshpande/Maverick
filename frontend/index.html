<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/anuman-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ANUMAAN — Simulated Aero-Propulsion Health Monitoring Console and Digital Twin Architecture (DRDO PS-26054)." />
    <title>ANUMAAN — Multi-Engine Health Console (DRDO PS-26054)</title>
    <!-- Pixel Code Typography (Local Offline Asset) -->
    <link rel="stylesheet" href="/fonts/pixelcode/pixelcode.css" />
    <!-- Google Fonts with display=swap for zero FCP render blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,500;0,600;0,700;1,500&family=Archivo:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Sofia+Sans:wght@400;500;600;700&family=Sofia+Sans+Condensed:wght@600;700;800&family=Sofia+Sans+Extra+Condensed:wght@700;800&family=Alegreya+Sans:ital,wght@1,400;1,500&display=swap" rel="stylesheet" />
    <!-- Landing first screen is the sortie film: start the airframe and its Draco decoder at HTML parse
         time instead of waiting for the JS bundle. Engine CAD models load later, when scrolled to. -->
    <link rel="preload" href="/models/uav_predator.glb" as="fetch" type="model/gltf-binary" crossorigin="anonymous" fetchpriority="high" />
    <link rel="preload" href="/draco/draco_wasm_wrapper.js" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/draco/draco_decoder.wasm" as="fetch" type="application/wasm" crossorigin="anonymous" />
  </head>
  <body class="bg-background text-[#f2f2f3] font-sans antialiased overflow-x-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
